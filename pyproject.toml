[project]
name = "xcsim"
version = "0.1.0"
description = "星川商城仿真业务环境（虚构电商中台，供 Agent 初学者练习对接）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "faker==40.44.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
xcsim = "xcsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xcsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
