# ===================== 计算 =====================

- id: Q023
  category: 计算
  difficulty: hard
  behavior: answer
  question: "我一单买了 SoundAir Pro 耳机（699 元）和 AF55 空气炸锅（399 元），用了满 1000 减 100，实付 998 元。现在只想把空气炸锅七天无理由退掉，能退多少钱？"
  reference_answer: "满减按原价比例分摊：空气炸锅分摊的优惠 = 100 × 399 ÷ 1098 ≈ 36.34 元，退款 = 399 − 36.34 = 362.66 元。如选择上门取件，还要从退款中扣除 12 元取件运费。"
  must_include:
    - ["362.66"]
  must_not_include: ["349", "299"]
  gold_docs: [P01-return-7day]
  evidence:
    - {doc: P01-return-7day, quote: "优惠按各商品原价占订单商品原价总额的比例分摊"}
    - {doc: P01-return-7day, quote: "按四舍五入保留到分"}
  notes: "按比例分摊并四舍五入到分"

