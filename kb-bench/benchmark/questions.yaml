# 星川商城知识库问答基准
#
# 字段说明：
#   id               题号
#   category         题型（见 README）
#   difficulty       easy / medium / hard
#   behavior         期望行为：answer 正常作答；admit_unknown 承认不知道并引导；
#                    clarify 追问缺失信息；correct_premise 纠正错误前提；decline_promise 拒绝规则外承诺
#   question         用户问题（日期、会员等级等情境直接写在问题里）
#   reference_answer 参考答案
#   must_include     关键事实，每一项是一组可接受的写法，命中任意一种即算包含该事实
#   must_not_include 出现即判错的说法（只收录明确错误的写法）
#   gold_docs        回答所需的文档，用于计算检索指标
#   evidence         参考答案在文档中的出处原文，validate 命令会逐条核对
#   notes            出题意图

questions:

